name: backup_partitions
description: "Backup Android Device Partitions"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  file_picker: ^12.1.2
  crypto: ^3.0.3
  url_launcher: ^6.3.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "icon.png"
  windows:
    generate: true
    image_path: "icon.png"
    icon_size: 64

flutter:
  uses-material-design: true

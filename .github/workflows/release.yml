name: Release CI

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Read pubspec version
        shell: bash
        run: |
          VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          VERSION="${VERSION%%+*}"
          if [ -z "$VERSION" ]; then
            echo "Could not read version from pubspec.yaml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          EXPECTED="v${{ steps.version.outputs.version }}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match pubspec version '$EXPECTED'." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: release-windows-x64
            asset: AndroidPartitionBackup-Windows-x64.zip
          - name: macOS
            os: macos-latest
            artifact: release-macos
            asset: AndroidPartitionBackup-macOS.zip
          - name: Linux x64
            os: ubuntu-latest
            artifact: release-linux-x64
            asset: AndroidPartitionBackup-Linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libblkid-dev liblzma-dev

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows
        if: runner.os == 'Windows'
        run: flutter build windows --release

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          if (-not (Test-Path $release)) {
            throw "Windows release directory not found: $release"
          }
          Compress-Archive -Path "$release\*" -DestinationPath "${{ matrix.asset }}" -Force

      - name: Build macOS
        if: runner.os == 'macOS'
        run: flutter build macos --release

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No macOS .app bundle found." >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "${{ matrix.asset }}"

      - name: Build Linux
        if: runner.os == 'Linux'
        run: flutter build linux --release

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          if [ ! -d "$BUNDLE" ]; then
            echo "Linux release bundle not found: $BUNDLE" >&2
            exit 1
          fi
          tar -C "$BUNDLE" -czf "${{ matrix.asset }}" .

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
